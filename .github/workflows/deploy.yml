name: Deploy to Streamlit Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare-deployment:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Cache de dependências
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Configurar variáveis de ambiente
      run: |
        echo "DB_USER=${{ secrets.DB_USER }}" >> .env
        echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
        echo "DB_DSN=${{ secrets.DB_DSN }}" >> .env
    
    - name: Popular banco de dados
      run: |
        python config/populate_db.py
      continue-on-error: true
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DSN: ${{ secrets.DB_DSN }}
    
    - name: Treinar modelo
      run: |
        python src/train_model.py
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DSN: ${{ secrets.DB_DSN }}
    
    - name: Verificar modelo gerado
      run: |
        if [ -f "model.joblib" ]; then
          echo "✅ Modelo treinado com sucesso!"
          ls -lh model.joblib
        else
          echo "❌ Erro: Modelo não foi gerado!"
          exit 1
        fi
    
    - name: Commit do modelo treinado
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add model.joblib
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Atualizar modelo treinado [skip ci]"
    
    - name: Push das mudanças
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
